<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TideTurn</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; font-family: 'Varela Round', sans-serif; }
    body { background: #E4F4F4; }

    /* NAVBAR */
    nav { display: flex; justify-content: space-between; align-items: center; background: #264F8E; padding: 0 40px; height: 75px; }
    .brand { display: flex; align-items: center; gap: 18px; color: #fff; font-weight: bold; font-size: 1.6rem; letter-spacing: 0.5px; }
    
    /* Using mix-blend-mode to magically drop the white background of the image out completely */
    .brand img { height: 48px; width: auto; display: block; mix-blend-mode: multiply; } 
    
    .nav-links { display: flex; align-items: stretch; height: 100%; gap: 10px; }
    .nav-links a { display: flex; align-items: center; text-decoration: none; color: #fff; font-size: 1.05rem; font-family: 'Varela Round', sans-serif; padding: 0 25px; transition: all 0.2s ease; }
    .nav-links a:hover, .nav-links a:active { background: #4B77C2; color: #fff; border-radius: 4px; height: 70%; margin-top: auto; margin-bottom: auto; }

    /* BANNER */
    header { 
      position: relative; 
      height: 380px; 
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://toiimg.com') center/cover no-repeat; 
      padding: 50px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }
    .left-content { max-width: 600px; margin-top: 10px; }
    h1 { font-size: 34px; color: #fff; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); margin-bottom: 25px; line-height: 1.3; }
    
    /* DONATE BUTTON */
    .donate-btn { display: inline-flex; align-items: center; justify-content: center; width: 140px; height: 44px; background: #E9988E; color: #fff; font-weight: bold; text-decoration: none; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.2s; }
    .donate-btn:hover { background: #d6857b; }

    /* INFO BOX */
    .info-box { position: absolute; bottom: 50px; right: 30px; background: #E9988E; padding: 15px 20px; border-radius: 6px; max-width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    .info-box p { font-size: 20px; color: #fff; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- NAVBAR  -->
  <nav>
    <div class="brand">
      <img src="https://favpng.com" alt="TideTurn Logo"> 
      TideTurn
    </div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Information</a>
      <a href="#">Safety</a>
    </div>
  </nav>

  <!-- BANNER -->
  <header>
    <div class="left-content">
      <h1>Safer Communities. <br> Stronger Tomorrows</h1>
      <!-- DONATE BUTTON -->
      <a href="https://assam.gov.in" target="_blank" class="donate-btn">DONATE</a>
    </div>
    
    <!-- INFO BOX -->
    <div class="info-box">
      <p>Be aware. Be prepared. <br> Be safe.</p>
    </div>
  </header>

</body>
</html>

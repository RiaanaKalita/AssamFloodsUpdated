<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TideTurn</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; font-family: 'Varela Round', sans-serif; }
    body { background: #E4F4F4; }

    nav { display: flex; justify-content: space-between; align-items: center; background: #264F8E; padding: 15px 30px; }
    .brand { display: flex; align-items: center; gap: 15px; color: #fff; font-weight: bold; font-size: 1.3rem; }
    .brand svg { height: 32px; width: 32px; display: block; fill: currentColor; } 
    nav div:last-child { display: flex; align-items: center; justify-content: center; gap: 35px; }
    nav a { text-decoration: none; color: #fff; font-size: 1rem; font-family: 'Varela Round', sans-serif; transition: 0.2s; }
    nav a:hover { color: #90BEB3; }

    header { 
      position: relative; 
      height: 380px; 
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://unsplash.com') center/cover no-repeat; 
      padding: 50px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }
    
    .left-content { max-width: 500px; margin-top: 30px; }
    h1 { font-size: 26px; color: #fff; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); margin-bottom: 20px; }
    
    .donate-btn { display: inline-flex; align-items: center; justify-content: center; width: 140px; height: 44px; background: #E9988E; color: #fff; font-weight: bold; text-decoration: none; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.2s; }
    .donate-btn:hover { background: #d6857b; }

    .info-box { position: absolute; bottom: 50px; right: 30px; background: #E9988E; padding: 15px 20px; border-radius: 6px; max-width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
    .info-box p { font-size: 20px; color: #fff; line-height: 1.4; }
  </style>
</head>
<body>

  <nav>
    <div class="brand">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 14h8v6l2 2 2-2v-6h8L12 2zm0 3.3L18.6 13H14v5h-4v-5H5.4L12 5.3z"/>
      </svg>
      TideTurn
    </div>
    <div><a href="#">Home</a><a href="#">Information</a><a href="#">Safety</a></div>
  </nav>

  <header>
    <div class="left-content">
      <h1>Safer Communities. <br> Stronger Tomorrows</h1>
      <a href="https://assam.gov.in" target="_blank" class="donate-btn">DONATE</a>
    </div>
    
    <div class="info-box">
      <p>Be aware. Be prepared. <br> Be safe.</p>
    </div>
  </header>

</body>
</html>

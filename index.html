<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assam Relief Page</title>
  <!-- Fixed Google Fonts Link -->
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; font-family: 'Varela Round', sans-serif; }
    body { background: #E4F4F4; }

    /* NAVBAR */
    nav { display: flex; justify-content: space-between; align-items: center; background: #264F8E; padding: 15px 30px; }
    .brand { display: flex; align-items: center; gap: 15px; color: #fff; font-weight: bold; font-size: 1.3rem; }
    .brand img { height: 40px; width: auto; object-fit: contain; } /* Added layout rules to make logo show nicely */
    nav a { text-decoration: none; color: #fff; margin-left: 25px; transition: 0.2s; }
    nav a:hover { color: #90BEB3; }

    /* BANNER */
    header { position: relative; height: 500px; background: url('https://indianexpress.com') center/cover no-repeat; padding: 50px; }
    h1 { font-size: 26px; color: #fff; max-width: 500px; text-shadow: 2px 2px 8px rgba(0,0,0,0.8); margin-top: 100px; }

    /* INFO BOX / DONATE BUTTON CONTAINER */
    /* Changed the background color directly to #E9988E and removed the small separate button */
    .info-box { 
      position: absolute; 
      bottom: 30px; 
      right: 30px; 
      background: #E9988E; 
      padding: 25px; 
      border-radius: 6px; 
      max-width: 340px; 
      text-decoration: none; 
      display: block;
      transition: background 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .info-box:hover {
      background: #d6857b; /* Darkens the whole box slightly on hover */
    }
    .info-box p { font-size: 20px; color: #fff; font-weight: bold; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <div class="brand">
      <!-- Fixed Logo Direct Link -->
      <img src="https://pngtree.com" alt="Logo"> 
      TideTurn
    </div>
    <div><a href="#">Home</a><a href="#">Information</a><a href="#">Safety</a></div>
  </nav>

  <!-- BANNER -->
  <header>
    <h1>Safer Communities. <br> Stronger Tomorrows</h1>
    
    <!-- INFO BOX (Entire box is now the link, no arrow inside) -->
    <a href="https://assam.gov.in" target="_blank" class="info-box">
      <p>Be aware. Be prepared. <br> Be safe.</p>
    </a>
  </header>

</body>
</html>
